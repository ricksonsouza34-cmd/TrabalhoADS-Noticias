<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar notícias</title><link rel="stylesheet" href="style.css"></head><body><header class="topo"><div class="container topo-conteudo"><a class="logo" href="index.html">Portal Notícias</a><button class="btn danger" id="logout">Sair</button></div></header><main class="container"><form class="form-page" id="newsForm"><h1 id="formTitle">Cadastrar notícia</h1><label for="title">Título</label><input id="title" required><label for="category">Categoria</label><select id="category"><option>Brasil</option><option>Mundo</option><option>Tecnologia</option><option>Esportes</option></select><label for="image">URL da imagem (opcional)</label><input id="image" type="url"><label for="content">Texto da notícia</label><textarea id="content" required></textarea><button class="btn" type="submit">Salvar notícia</button><button class="btn danger" type="button" id="cancelEdit" hidden>Cancelar edição</button><p id="message"></p><div id="newsList" class="admin-list"></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
